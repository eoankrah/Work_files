name: Validate financial analytics portfolio
on:
  push:
    paths: ['financial-risk-analytics-portfolio/**', '.github/workflows/portfolio-validate.yml']
  pull_request:
    paths: ['financial-risk-analytics-portfolio/**', '.github/workflows/portfolio-validate.yml']
jobs:
  analytics:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: financial-risk-analytics-portfolio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python src/run.py
      - run: python -m unittest discover -s tests
      - run: node tests/validate_dashboard.cjs
